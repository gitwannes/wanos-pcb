# --- file: projects/wanos-board/design.yaml ---
# Design intent — wanos-pcb-v1 (R1 locked 2026-09-01)

name: wanos-board
revision: wanos-pcb-v1
description: Raspberry Pi carrier — expanders, SSR drives, SHT31 mux plant, WISC e-ink HDMI-SPI, 85x56 mm
kicadVersion: "10.0"

wanosRepo: https://github.com/gitwannes/wanos
spec: docs/board-spec.md
fieldWiring: docs/field-wiring.md
bomSeed: projects/wanos-board/components.xlsx

wiscSubset: docs/gpio-interface.md  # V1a bring-up map
wiscReference: docs/reference/wisc-board/

rails:
  - name: PI_5V
    voltage: 5.0
    notes: Pi header or optional USB-C (J41)
  - name: LOGIC_3V3
    voltage: 3.3
    notes: From Pi
  - name: SSR_12V
    voltage: 12.0
    notes: External sauna rail; monitored; cut by external safety
  - name: GND
    voltage: 0

blocks:
  - id: pi_header
    description: 40-pin Pi + optional USB-C power
    nets: [PI_5V, LOGIC_3V3, GND]
  - id: io_expanders
    description: PCA9554PW x2 — doors, meters, kWh, buttons, 12V mon
    doc: docs/io-expander-map.md
  - id: sht31_plant
    description: TCA9546A mux — 4x SHT31 @ 0x44, 4x 4-pin Cat5 ~4-5m
    doc: docs/field-wiring.md
  - id: ssr_drivers
    description: Pi GPIO -> PN2222A x4 -> J13 5-pin SSR
    doc: docs/board-spec.md
  - id: safety_12v_mon
    description: Optocoupler -> Expander B P6
    doc: docs/io-expander-map.md
  - id: wisc_eink
    description: HDMI Type-A repurposed SPI
    doc: docs/hdmi-spi-eink.md
  - id: lcd_i2c
    description: 1x 4-pin I2C J16 (2 LCDs paralleled)
    doc: docs/field-wiring.md

constraints:
  boardSizeMm: [85, 56]
  layers: 2
  thicknessMm: 1.6
  surfaceFinish: ENIG
  minTrackWidthMm: 0.25
  minClearanceMm: 0.2
  tooling: Konnect + KiCad 10
  silkscreenFont: https://www.fontspace.com/printed-circuit-board-7-font-f15777

openQuestions:
  - "R2: Pi BCM map for SSR + I2C + SPI"
  - "R2: V1a adapter strategy for current WanOS on WISC-equivalent map"
  - "R2: external plant + grounding docs"
