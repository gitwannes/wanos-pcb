# --- file: projects/wanos-board/design.yaml ---
# Design intent — wanos-pcb-v1

name: wanos-board
revision: wanos-pcb-v1
description: Raspberry Pi carrier — expanders, SSR drives, SHT31 plant, WISC e-ink HDMI-SPI, 85x56 mm
kicadVersion: "10.0"

wanosRepo: https://github.com/gitwannes/wanos
spec: docs/board-spec.md
bomSeed: projects/wanos-board/components.xlsx

# Production today: WISC boards. This revision is new hardware; full features need future WanOS.
wiscSubset: docs/gpio-interface.md  # V1a bring-up map

rails:
  - name: PI_5V
    voltage: 5.0
    notes: Pi header or optional USB-C (J41)
  - name: LOGIC_3V3
    voltage: 3.3
    notes: From Pi
  - name: SSR_12V
    voltage: 12.0
    notes: External sauna rail; monitored; cut by external safety
  - name: GND
    voltage: 0

blocks:
  - id: pi_header
    description: 40-pin Pi + optional USB-C power
    nets: [PI_5V, LOGIC_3V3, GND]
  - id: io_expanders
    description: PCA9554PW x2 — doors, meters, kWh, buttons
    doc: docs/io-expander-map.md
  - id: sht31_plant
    description: PCA9615 differential I2C — 4x SHT31 (segment plan R1)
    doc: docs/board-spec.md
  - id: ssr_drivers
    description: Pi GPIO -> PN2222A x4 -> external SSR JST
    doc: docs/board-spec.md
  - id: safety_12v_mon
    description: Optocoupler 12V presence -> expander (pin R1)
    doc: docs/board-spec.md
  - id: wisc_eink
    description: HDMI Type-A repurposed SPI
    doc: docs/hdmi-spi-eink.md
  - id: lcd_i2c
    description: 2x I2C LCD headers (JST TBD R1)
    doc: docs/board-spec.md

constraints:
  boardSizeMm: [85, 56]
  layers: 2
  thicknessMm: 1.6
  surfaceFinish: ENIG
  minTrackWidthMm: 0.25
  minClearanceMm: 0.2
  tooling: Konnect + KiCad 10

openQuestions:
  - "R1: 12V monitor pin vs second kWh on Expander A P7"
  - "R1: SHT31 addressing (mux vs multi-segment PCA9615)"
  - "R1: J2/J6 connector pin counts vs components.xlsx"
  - "R1: 2x dedicated LCD JST headers"
  - "R2: Pi BCM map for SSR + I2C + SPI"
  - "R2: V1a adapter strategy for current WanOS on WISC-equivalent map"
