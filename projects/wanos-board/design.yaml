# --- file: projects/wanos-board/design.yaml ---
# Design intent — wanos-pcb-v1 (R1 + R2 locked 2026-09-01)

name: wanos-board
revision: wanos-pcb-v1.0
description: Raspberry Pi 4 carrier — expanders, SSR drives, SHT31 mux plant, HDMI-SPI e-ink, 85x56 mm
kicadVersion: "10.0"

wanosRepo: https://github.com/gitwannes/wanos
spec: docs/board-spec.md
fieldWiring: docs/field-wiring.md
externalPlant: docs/external-plant.md
grounding: docs/grounding.md
gpioMap: docs/gpio-interface.md
bomSeed: projects/wanos-board/components.xlsx
datasheets: docs/reference/datasheets/

wiscReference: docs/reference/wisc-board/

targetPi: Raspberry Pi 4
mechanicalReference: docs/reference/wisc-board/wisc-v2-6-4-hdmi.md

rails:
  - name: PI_5V
    voltage: 5.0
    notes: J17 screw terminal -> +5VA -> J40 pins 2/4; J41 DNP
  - name: LOGIC_3V3
    voltage: 3.3
    notes: From Pi
  - name: SSR_12V
    voltage: 12.0
    notes: J14 +12V after external safety; monitored U4 on pi_power
  - name: GND
    voltage: 0

blocks:
  - id: pi_power
    description: J17 + J14 screw terminals; 5V conditioning, D3 TVS, FB1, J40; status D23/D24; U4 12V monitor; J41 DNP
    doc: docs/gpio-interface.md
  - id: io_expanders
    description: PCA9554PW x2 — doors, kWh, buttons, door/kWh LEDs, 12V mon; INT NC
    doc: docs/io-expander-map.md
  - id: water_meters
    description: J4 RJ45 YF-B6/B10 x4 over Cat5 ~10m — TVS D25-D29, OD pull-up 3V3, series R, debounce, LEDs; no MOSFET; J5 unused
    doc: docs/field-wiring.md
  - id: sht31_plant
    description: TCA9546A mux — 4x SHT31 @ 0x44, 4x 4-pin Cat5 ~4-5m
    doc: docs/field-wiring.md
  - id: ssr_drivers
    description: Pi GPIO -> PN2222A x4 -> J13 5-pin; safety BCM4 on-board
    doc: docs/external-plant.md
  - id: eink_hdmi_spi
    description: Molex 208658-1052 J1 — SPI per hdmi-spi-eink.md
    doc: docs/hdmi-spi-eink.md
  - id: lcd_i2c
    description: 1x 4-pin I2C J16 (2 LCDs paralleled)
    doc: docs/field-wiring.md

constraints:
  boardSizeMm: [85, 56]
  layers: 2
  thicknessMm: 1.6
  surfaceFinish: ENIG
  minTrackWidthMm: 0.25
  minClearanceMm: 0.2
  tooling: Konnect + KiCad 10
  silkscreenFont: https://www.fontspace.com/printed-circuit-board-7-font-f15777
  silkscreenRevision: wanos-pcb-v1.0
  jlcpcbAssembly: full PCBA including J40; LCSC C6990958 HDMI
